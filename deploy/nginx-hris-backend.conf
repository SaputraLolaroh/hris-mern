# Konfigurasi Nginx sebagai reverse proxy untuk backend Express.js di AWS EC2
# Letakkan di: /etc/nginx/sites-available/hris-backend
# Aktifkan: sudo ln -s /etc/nginx/sites-available/hris-backend /etc/nginx/sites-enabled/
# Lalu: sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    server_name api.namadomainanda.com;  # Ganti dengan domain atau IP publik EC2

    # Batasi ukuran unggahan file (penting untuk fitur upload slip PDF/foto)
    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:5000;  # Arahkan ke port Express.js (PM2)
        proxy_http_version 1.1;

        # Header untuk dukungan WebSocket & proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Teruskan alamat IP asli klien ke Express
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Setelah konfigurasi di atas berjalan, pasang SSL gratis:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.namadomainanda.com
